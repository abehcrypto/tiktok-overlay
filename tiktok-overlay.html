<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABÊ Games — TikTok Presentes Overlay</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent !important;
        font-family: 'Press Start 2P', cursive, monospace;
    }

    /* Carrossel alinhado dentro do quadro da Webcam */
    #meme-carousel-container {
        position: absolute;
        top: 140px;
        left: 310px;
        width: 500px;
        background: rgba(15, 12, 30, 0.85);
        border: 2px solid #5d3ebd;
        border-radius: 10px;
        padding: 8px;
        box-shadow: 0 0 12px rgba(123, 44, 191, 0.6);
        color: #fff;
        z-index: 10;
    }

    .title {
        text-align: center;
        font-size: 10px;
        color: #fca311;
        text-shadow: 2px 2px #000;
        margin-bottom: 6px;
        text-transform: uppercase;
    }

    .carousel-wrapper {
        width: 100%;
        overflow: hidden;
        position: relative;
        padding-top: 10px;
    }

    .carousel-track {
        display: flex;
        gap: 10px;
        width: max-content;
        animation: scroll 15s linear infinite;
    }

    @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    .meme-card {
        background: rgba(30, 20, 60, 0.7);
        border: 1px solid #7b2cbf;
        border-radius: 8px;
        padding: 6px;
        width: 105px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
        margin-top: 4px;
    }

    .meme-img {
        width: 48px;
        height: 48px;
        object-fit: contain;
    }

    .combo-badge {
        position: absolute;
        top: 4px;
        right: 4px;
        background: #ff0055;
        color: #fff;
        font-size: 6px;
        padding: 2px 4px;
        border-radius: 3px;
        font-weight: bold;
        box-shadow: 0 0 4px #ff0055, 1px 1px 2px #000;
        z-index: 2;
    }

    .meme-name {
        font-size: 9px;
        color: #00f5d4;
        text-align: center;
        margin-top: 6px;
        line-height: 1.3;
        text-transform: uppercase;
        text-shadow: 1px 1px 2px #000;
    }

    #overlay {
        position: absolute;
        top: 650px;
        left: 0;
        width: 1080px;
        height: 660px;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
    }

    #status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 9999;
        padding: 4px 7px;
        border-radius: 4px;
        background: rgba(0,0,0,.55);
        color: white;
        font: 10px Arial, sans-serif;
        pointer-events: none;
    }

    #video {
        display: none;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="meme-carousel-container">
    <div class="title">✨ PRESENTES X MEMES ✨</div>
    <div class="carousel-wrapper">
        <div class="carousel-track" id="meme-track"></div>
    </div>
</div>

<div id="overlay">
    <video id="video" playsinline preload="auto"></video>
</div>

<div id="status">🔄 Conectando ao Streamer.bot...</div>

<script src="https://cdn.jsdelivr.net/npm/@streamerbot/client/dist/streamerbot-client.js"></script>

<script>
const CONFIG = {
    actionName: "PRESENTES",
    galleryVersion: "v1_semana1_reset_v4",

    galleryGifts: {
        "7001": 1, "6120": 1, "6427": 1, "6801": 1, "5912": 1,
        "6267": 1, "5487": 1, "5656": 4, "6523": 1, "5655": 1, "5879": 2,
        "12631": 1
    },

    memeList: [
        { name: "Plankton Bolado", image: "rosa.png" },
        { name: "Yamete Kudasai", image: "rosa.png", combo: "x10" },
        { name: "Menino de Pau", image: "Mãos fazendo coração.png" },
        { name: "Eu Vim Ver o Mamaco", image: "heart_me.png" },
        { name: "Sebastian", image: "rosquinha.png" },
        { name: "Susto", image: "chapéu_e_bigode.png" },
        { name: "Gato Assustador", image: "Gato_assustador.png" }
    ],

    gifts: {
        "7934": "mamaco.mp4",        
        "6427": "susto.mp4",         
        "5879": "sebastian.mp4",     
        "6267": "apagar_luz.mp4",    
        "5655": "plankton.mp4",      
        "5487": "menino_de_pau.mp4",
        "12631": "gato.mp4"
    },

    roseId: "5655",
    yameteFile: "yamete.mp4",
    defaultGiftFile: "dinheiro.mp3",
    showStatus: true
};

const video = document.getElementById("video");
const status = document.getElementById("status");

let playing = false;
let queue = [];
let reconnectTimer = null;

function renderMemeCarousel() {
    const track = document.getElementById("meme-track");
    track.innerHTML = "";

    const fullList = [...CONFIG.memeList, ...CONFIG.memeList];

    fullList.forEach(item => {
        const card = document.createElement("div");
        card.className = "meme-card";

        const comboHTML = item.combo ? `<div class="combo-badge">COMBO ${item.combo}</div>` : "";

        card.innerHTML = `
            ${comboHTML}
            <img class="meme-img" src="${item.image}" alt="${item.name}">
            <div class="meme-name">${item.name}</div>
        `;

        track.appendChild(card);
    });
}

function setStatus(text) {
    if (CONFIG.showStatus) {
        status.textContent = text;
        status.style.display = "block";
    } else {
        status.style.display = "none";
    }
}

function enqueueVideo(file) {
    if (!file) return;
    queue.push(file);
    processQueue();
}

async function processQueue() {
    if (playing || queue.length === 0) return;
    playing = true;

    const file = queue.shift();

    try {
        video.pause();
        video.currentTime = 0;
        video.src = file;
        video.style.display = "block";

        await video.play();

        await new Promise(resolve => {
            const finish = () => {
                video.removeEventListener("ended", finish);
                video.removeEventListener("error", finish);
                resolve();
            };
            video.addEventListener("ended", finish, { once: true });
            video.addEventListener("error", finish, { once: true });
        });

    } catch (error) {
        console.error("Erro ao reproduzir arquivo:", file, error);
    }

    video.pause();
    video.removeAttribute("src");
    video.load();
    video.style.display = "none";

    playing = false;
    processQueue();
}

function handleStreamerbotAction(data) {
    if (!data) return;

    const actionName = data.name || data.actionName || "";
    if (actionName !== CONFIG.actionName) return;

    const args = data.arguments || {};
    const giftId = String(args.giftId ?? "");
    const repeatCount = Number(args.repeatCount ?? 1);

    const storageKey = "gallery_progress_" + CONFIG.galleryVersion;
    const galleryProgress = JSON.parse(localStorage.getItem(storageKey)) || {};
    const currentQty = galleryProgress[giftId] || 0;
    const maxQty = CONFIG.galleryGifts[giftId] || 0;

    if (maxQty > 0 && currentQty === maxQty) {
        console.log("Item atingiu limite da galeria!");
        return; 
    }

    if (giftId === CONFIG.roseId) {
        if (repeatCount >= 10) {
            enqueueVideo(CONFIG.yameteFile);
        } else {
            enqueueVideo(CONFIG.gifts[giftId] || CONFIG.defaultGiftFile);
        }
        return;
    }

    const file = CONFIG.gifts[giftId];
    if (file) {
        enqueueVideo(file);
    } else {
        enqueueVideo(CONFIG.defaultGiftFile);
    }
}

function connectStreamerbot() {
    try {
        setStatus("🔄 Conectando ao Streamer.bot...");
        window.streamerbotClient = new StreamerbotClient({
            host: "127.0.0.1",
            port: 8080,
            endpoint: "/"
        });

        window.streamerbotClient.on("Raw.Action", ({ event, data }) => {
            handleStreamerbotAction(data);
        });

        setStatus("🟢 Overlay conectado ao Streamer.bot!");
        setTimeout(() => {
            if (CONFIG.showStatus) status.style.display = "none";
        }, 3000);

    } catch (error) {
        setStatus("🔴 Erro ao conectar ao Streamer.bot");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectStreamerbot, 5000);
    }
}

window.addEventListener("load", () => {
    renderMemeCarousel();
    connectStreamerbot();
});
</script>
</body>
</html>
